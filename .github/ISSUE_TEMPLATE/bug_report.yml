name: Bug report
description: Report a reproducible problem in the repository.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, API keys, wallet secrets, seed phrases,
        private keys, private endpoints, or personal financial data. For an
        unresolved security issue, use the private process in SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include bounded error text only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic reproduction using synthetic data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, pnpm version, and affected package or commit.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I have removed credentials, wallet/private-key material, private endpoints, and personal data.
          required: true
        - label: This report does not request trading, custody, recommendations, or unsupported live Ritual behavior.
          required: true
